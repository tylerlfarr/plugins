# Fly.io single-instance deploy sketch — do not purchase/deploy without owner auth.
# Expected: shared-cpu-1x + 1GB volume ≈ low tens of USD/month (check current Fly pricing).
# Account: Fly.io org + payment method required by operator/owner.

app = "permit-ledger-pilot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  AUTO_SEED = "0"
  PILOT_AUTH = "1"
  COOKIE_SECURE = "1"
  PERMIT_DB_PATH = "/data/permit-ledger.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "permit_ledger_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
